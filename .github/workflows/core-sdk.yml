name: Windows Arrow diagnosis
on:
  push:
    branches: ['codex/windows-arrow-diagnosis']
permissions:
  contents: read
jobs:
  probe:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: mamba-org/setup-micromamba@f457c30a868e4760d3a6fcea5f25dc655b8edf39
        with:
          environment-file: tools/ci/environment.yml
          micromamba-version: 2.9.0-0
          create-args: glpk=5.*
          init-shell: none
          generate-run-shell: false
          cache-environment: true
          cache-environment-key: core-windows-x64
      - run: micromamba run -n core-ci python tools/arrow-diagnosis/run.py
      - if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: windows-arrow-diagnosis
          path: tools/arrow-diagnosis/results.json

name: Core SDK

on:
  push:
    branches: ['**']
    # Formula-only updates use the bottle workflow; source changes also test a candidate formula below.
    paths-ignore: ['Formula/**', '.github/workflows/bottle.yml']
  pull_request:
  workflow_dispatch:
    inputs:
      sdk_run_id:
        description: "Existing Core CI run: accept its SDK archives without rebuilding (optional)"
        type: string
        required: false

permissions:
  contents: read
  actions: read

jobs:
  native:
    name: ${{ matrix.platform }} / Release
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    concurrency:
      group: core-sdk-${{ github.ref }}-${{ matrix.platform }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-24.04
            packages: gcc_linux-64=14 gxx_linux-64=14 coin-or-cbc=2.10.*
            jobs: 4
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            packages: gcc_linux-aarch64=14 gxx_linux-aarch64=14 coin-or-cbc=2.10.*
            jobs: 4
          - platform: macos-arm64
            runner: macos-15
            packages: llvm-openmp coin-or-cbc=2.10.*
            jobs: 2
          - platform: macos-x64
            runner: macos-15-intel
            packages: llvm-openmp coin-or-cbc=2.10.*
            jobs: 4
          - platform: windows-x64
            runner: windows-2022
            packages: glpk=5.*
            jobs: 4
    env:
      GH_TOKEN: ${{ github.token }}
      OPENMS_SDK_RUN_ID: ${{ inputs.sdk_run_id }}
      PYTHONUTF8: '1'
      OMP_NUM_THREADS: '1'
      OPENMS_RUN_SLOW_TESTS: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: mamba-org/setup-micromamba@f457c30a868e4760d3a6fcea5f25dc655b8edf39 # v3
        with:
          environment-file: tools/ci/environment.yml
          micromamba-version: 2.9.0-0
          create-args: ${{ matrix.packages }}
          init-shell: none
          generate-run-shell: false
          cache-environment: true
          cache-environment-key: core-${{ matrix.platform }}
      - name: Build, test, install, and accept the extracted SDK
        run: >-
          micromamba run -n core-ci python tools/ci/run.py
          --platform ${{ matrix.platform }} --jobs ${{ matrix.jobs }}
          --work-dir "${{ runner.temp }}/core-sdk"
      - name: Upload SDK archive for qualification or diagnostics
        if: always() && inputs.sdk_run_id == ''
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: sdk-${{ matrix.platform }}
          path: ${{ runner.temp }}/core-sdk/dist/*
          if-no-files-found: error
          compression-level: 0
      - name: Upload logs and test reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: results-${{ matrix.platform }}
          path: |
            ${{ runner.temp }}/core-sdk/results/
            ${{ runner.temp }}/core-sdk/acceptance/*.log
            ${{ runner.temp }}/core-sdk/acceptance/results.json
            ${{ runner.temp }}/core-sdk/build/Testing/Temporary/LastTest.log
            ${{ runner.temp }}/core-sdk/build/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: warn

  homebrew:
    name: Homebrew / ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-arm64
            runner: macos-15
          - platform: macos-x64
            runner: macos-15-intel
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build and test the exact source revision with Homebrew
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
        run: |
          revision=$(git rev-parse HEAD)
          url="https://github.com/${GITHUB_REPOSITORY}/archive/${revision}.tar.gz"
          archive="${RUNNER_TEMP}/core-source.tar.gz"
          curl --fail --location --retry 3 "$url" --output "$archive"
          brew tap-new --no-git openms-ci/core
          python3 tools/ci/prepare_homebrew_formula.py \
            --formula Formula/openms4-core.rb --revision "$revision" --url "$url" \
            --archive "$archive" --output "$(brew --repo openms-ci/core)/Formula/openms4-core.rb"
          brew trust --formula openms-ci/core/openms4-core
          brew install --formula --build-from-source openms-ci/core/openms4-core
          brew test openms-ci/core/openms4-core
          python3 -c 'import json, sys; info = json.load(open(sys.argv[1])); assert info["source_revision"] == sys.argv[2] and info["source_dirty"] is False, info' \
            "$(brew --prefix openms-ci/core/openms4-core)/lib/cmake/OpenMS/OpenMSBuildInfo.json" "$revision"
